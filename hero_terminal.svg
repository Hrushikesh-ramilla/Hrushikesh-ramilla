<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="50%" stop-color="#0e1319"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="198" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="1" y="1" width="848" height="34" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <rect x="1" y="24" width="848" height="11" fill="#161b22"/>

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="18" r="5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="425" y="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">noir@system: ~</text>

  <!-- Terminal Content -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, ui-monospace, monospace" font-size="13.5">
    <!-- Prompt 1 -->
    <text x="25" y="66" fill="#3F6E73" font-weight="600">$</text>
    <text x="42" y="66" fill="#e6edf3" font-weight="500">whoami</text>
    <text x="25" y="90" fill="#8b949e">↳ Systems &amp; Infrastructure Architect &bull; Competitive Programmer &bull; Core OSS Contributor</text>

    <!-- Prompt 2 -->
    <text x="25" y="126" fill="#3F6E73" font-weight="600">$</text>
    <text x="42" y="126" fill="#e6edf3" font-weight="500">cat /etc/core-ethos.md</text>
    
    <!-- Ethos Text -->
    <text x="25" y="152" fill="#c9d1d9" font-style="italic">"Hardware is fast; software makes it slow. I engineer lock-free concurrency,</text>
    <text x="25" y="174" fill="#c9d1d9" font-style="italic"> high-throughput storage engines, and systems designed to hold under production load."</text>
    
    <!-- Blinking Cursor -->
    <rect x="696" y="162" width="7" height="14" fill="#64B5F6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
