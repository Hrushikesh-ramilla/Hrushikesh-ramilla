<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 215" width="100%" height="215" fill="none">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="1" y="1" width="848" height="213" rx="12" fill="url(#termBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <path d="M 1 13 C 1 6.5 6.5 1 13 1 L 837 1 C 843.5 1 849 6.5 849 13 L 849 36 L 1 36 Z" fill="#1f242c"/>
  <line x1="1" y1="36" x2="849" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="425" y="23" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">hrushikesh@desktop: ~ (zsh)</text>

  <!-- Terminal Body -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13">
    <!-- Prompt 1 -->
    <text x="26" y="66" fill="#38bdf8" font-weight="600">➜</text>
    <text x="46" y="66" fill="#a78bfa" font-weight="600">~</text>
    <text x="64" y="66" fill="#e6edf3">whoami</text>
    <text x="26" y="90" fill="#94a3b8">just an owl enthusiast turning coffee and curiosity into code ☕🦉</text>

    <!-- Prompt 2 -->
    <text x="26" y="124" fill="#38bdf8" font-weight="600">➜</text>
    <text x="46" y="124" fill="#a78bfa" font-weight="600">~</text>
    <text x="64" y="124" fill="#e6edf3">cat status.json</text>
    
    <text x="26" y="148" fill="#e6edf3">{</text>
    <text x="44" y="148" fill="#f472b6">"current_quest"</text><text x="175" y="148" fill="#e6edf3">: </text><text x="190" y="148" fill="#34d399">"building fun systems &amp; learning things under the hood",</text>
    
    <text x="44" y="170" fill="#f472b6">"philosophy"</text><text x="150" y="170" fill="#e6edf3">: </text><text x="165" y="170" fill="#fbbf24">"if it compiles on the first try, something is definitely wrong."</text>
    <text x="26" y="192" fill="#e6edf3">}</text>

    <!-- Cursor -->
    <rect x="42" y="180" width="8" height="15" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
