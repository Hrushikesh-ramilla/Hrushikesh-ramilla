<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 6" width="850" height="6" fill="none">
  <defs>
    <linearGradient id="warmLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEC5A7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#DEC5A7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F6F5F1" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#DEC5A7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DEC5A7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cometGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6F5F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F6F5F1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F6F5F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="2" width="850" height="2" rx="1" fill="url(#warmLineGrad)"/>

  <!-- Traveling animated comet beam -->
  <rect y="1.5" width="110" height="3" rx="1.5" fill="url(#cometGrad)">
    <animate attributeName="x" values="-120;860" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>