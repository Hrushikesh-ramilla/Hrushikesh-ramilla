<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 14" width="850" height="14" fill="none">
  <defs>
    <!-- 3D Channel Gradient -->
    <linearGradient id="chanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0C"/>
      <stop offset="100%" stop-color="#1A1B1D"/>
    </linearGradient>

    <linearGradient id="chanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D372F" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#5A4F41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3D372F" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Traveling Comet Beam -->
    <linearGradient id="cometBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEC5A7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#DEC5A7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#F6F5F1" stop-opacity="1"/>
      <stop offset="70%" stop-color="#DEC5A7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#DEC5A7" stop-opacity="0"/>
    </linearGradient>

    <filter id="beamGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Recessed Slab Channel Track -->
  <rect x="0" y="3" width="850" height="8" rx="4" fill="url(#chanBg)" stroke="url(#chanBorder)" stroke-width="1.2"/>

  <!-- Static ambient glow core -->
  <line x1="40" y1="7" x2="810" y2="7" stroke="#DEC5A7" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Thick Traveling Comet Beam Gliding Through the Slab Channel -->
  <rect y="4" width="160" height="6" rx="3" fill="url(#cometBeam)" filter="url(#beamGlow)">
    <animate attributeName="x" values="-180;860" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>