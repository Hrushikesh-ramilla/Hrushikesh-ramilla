<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 18" width="850" height="18" fill="none">
  <defs>
    <linearGradient id="specLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEC5A7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#DEC5A7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F6F5F1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#DEC5A7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DEC5A7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Guide Line -->
  <line x1="50" y1="9" x2="800" y2="9" stroke="url(#specLine)" stroke-width="1"/>

  <!-- 13 Harmonic Frequency Bars Bouncing Asynchronously -->
  <!-- Bar 1 -->
  <line x1="365" y1="9" x2="365" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;5;9;7;9" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;13;9;11;9" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 2 -->
  <line x1="375" y1="9" x2="375" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;3;9;6;9" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;15;9;12;9" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 3 -->
  <line x1="385" y1="9" x2="385" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;6;9;3;9" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;12;9;15;9" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 4 -->
  <line x1="395" y1="9" x2="395" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;2;9;7;9" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;16;9;11;9" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 5 -->
  <line x1="405" y1="9" x2="405" y2="9" stroke="#F6F5F1" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;1;9;5;9" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;17;9;13;9" dur="1.0s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 6 -->
  <line x1="415" y1="9" x2="415" y2="9" stroke="#F6F5F1" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="y1" values="9;2;9;4;9" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;16;9;14;9" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 7 (Center Peak) -->
  <line x1="425" y1="9" x2="425" y2="9" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round">
    <animate attributeName="y1" values="9;0;9;3;9" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;18;9;15;9" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 8 -->
  <line x1="435" y1="9" x2="435" y2="9" stroke="#F6F5F1" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="y1" values="9;3;9;1;9" dur="0.95s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;15;9;17;9" dur="0.95s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 9 -->
  <line x1="445" y1="9" x2="445" y2="9" stroke="#F6F5F1" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;5;9;2;9" dur="1.15s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;13;9;16;9" dur="1.15s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 10 -->
  <line x1="455" y1="9" x2="455" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;4;9;6;9" dur="1.35s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;14;9;12;9" dur="1.35s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 11 -->
  <line x1="465" y1="9" x2="465" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;6;9;3;9" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;12;9;15;9" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 12 -->
  <line x1="475" y1="9" x2="475" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;5;9;7;9" dur="1.25s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;13;9;11;9" dur="1.25s" repeatCount="indefinite"/>
  </line>
  <!-- Bar 13 -->
  <line x1="485" y1="9" x2="485" y2="9" stroke="#DEC5A7" stroke-width="2" stroke-linecap="round">
    <animate attributeName="y1" values="9;7;9;5;9" dur="1.45s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="9;11;9;13;9" dur="1.45s" repeatCount="indefinite"/>
  </line>
</svg>