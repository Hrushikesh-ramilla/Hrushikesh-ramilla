<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="850" height="60" fill="none">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#0e0f10"/>
    </linearGradient>
    <linearGradient id="animFootBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEC5A7" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F6F5F1" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DEC5A7" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="848" height="58" rx="8" fill="url(#footBg)" stroke="url(#animFootBorder)" stroke-width="1.2"/>
  <text x="425" y="27" fill="#F6F5F1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="14" font-weight="600" text-anchor="middle">Open to Software Engineering &amp; Backend Opportunities 🦉</text>
  <text x="425" y="46" fill="#A8927D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Feel free to explore my repositories or get in touch via LinkedIn and email above.</text>
</svg>